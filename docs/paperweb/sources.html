<main>

    <div class="eyebrow">/sources</div>
    <h1 style="font-size:44px;font-family:var(--serif)">论文站点导航</h1>
    <p style="color:var(--steel);max-width:52em;margin-top:12px">收录与这 45 篇论文出处直接相关的常用学术站点。收录原则：优先出版方与预印本平台；纯工具类不进站内。</p>

  </section>

<footer>
  <div class="wrap"><div class="bot">站点列表整合自常用学术书签 · 外链站点版权归各出版方所有</div></div>

  <div class="wrap mn-head"><span class="t">双轨导航</span><span class="cur">当前页：站点导航</span></div>
  <div class="wrap"><div class="mn-body"></div></div>
</div>

<script src="data/papers.js"></script>
<script src="assets/app.js"></script>
<script>
const GROUPS = [
  { name: "预印本 / 开放获取", desc: "最新工作通常先在这里出现，早于正式发表 6—18 个月。", items: [
    ["arXiv", "https://arxiv.org/", "arxiv.org"],
    ["DOAJ 开放获取期刊目录", "https://doaj.org/", "doaj.org"],
    ["Open Access Library (OALib)", "https://www.oalib.com/", "oalib.com"],
    ["ChinaXiv 中科院预印本", "https://chinaxiv.org/", "chinaxiv.org"],
    ["medRxiv", "https://www.medrxiv.org/", "medrxiv.org"]
  ]},
  { name: "出版方 / 学协会", desc: "论文正式出处。详情页的「原文」按钮优先指向这些站点。", items: [
    ["Nature", "https://www.nature.com/", "nature.com"],
    ["Science (AAAS)", "https://www.science.org/", "science.org"],
    ["ACM Digital Library", "https://dl.acm.org/", "dl.acm.org"],
    ["IEEE 会议库", "https://ieeexplore.ieee.org/", "ieeexplore"],
    ["JMLR", "https://jmlr.org/", "jmlr.org"],
    ["IOPscience", "https://iopscience.iop.org/", "iopscience"],
    ["Wiley Online Library", "https://onlinelibrary.wiley.com/", "wiley"],
    ["ScienceDirect (Elsevier)", "https://www.sciencedirect.com/", "sciencedirect"],
    ["Taylor & Francis Online", "https://www.tandfonline.com/", "tandfonline"],
    ["Oxford Academic", "https://academic.oup.com/", "oup"],
    ["JSTOR", "https://www.jstor.org/", "jstor.org"],
    ["MIT Open Scholarship", "https://openscholarship.mit.edu/", "mit.edu"],
    ["ASME Digital Collection", "https://asmedigitalcollection.asme.org/", "asme"]
  ]},
  { name: "国内入口 / 研究工具", desc: "部分出版方直连不稳定时走这里；工具用于管理与追踪。", items: [
    ["中国知网", "https://www.cnki.net/", "cnki.net"],
    ["知网研学", "https://x.cnki.net/", "x.cnki.net"],
    ["读者云门户", "https://www.duzheyun.cn/", "duzheyun"],
    ["Mendeley Reference Manager", "https://www.mendeley.com/reference-management/reference-manager", "mendeley"],
    ["citexs 科研助手", "https://www.citexs.com/", "citexs.com"]
  ]}
];
document.addEventListener("DOMContentLoaded", () => {
  $("#srcGrid").innerHTML = GROUPS.map(g => `<div class="card soft">
      <div class="eyebrow">${esc(g.name)}</div>
      <h3>${esc(g.name.split(" / ")[0])}</h3>
      <p>${esc(g.desc)}</p>
      <div class="srclinks">${g.items.map(([n, u, d]) => `<a href="${u}" target="_blank" rel="noopener">${esc(n)}<em>${esc(d)}</em></a>`).join("")}</div>
    </div>`).join("") + `<div class="card dark">
      <div class="eyebrow" style="color:#0091ff">收录原则</div>
      <h3>什么进站，什么不进</h3>
      <p>与 45 篇论文出处直接相关的出版方与预印本平台优先收录；词云、可视化等纯工具类站点不进站内，仅作外链。链接失效请以出版方官网为准。</p>
    </div>`;

  const venues = {};
  P.forEach(p => { const v = (p.venue || "—").replace(/\s*\d{4}$/, ""); venues[v] = (venues[v] || 0) + 1; });
  const top = Object.entries(venues).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const max = top[0][1];
  $("#venueBox").innerHTML = `<div class="card"><div class="eyebrow">按发表处计数</div>
    ${top.map(([v, n]) => `<div class="score"><span class="nm" style="width:190px">${esc(v)}</span><span class="bar"><i style="width:${n / max * 100}%"></i></span><span class="v">${n}</span></div>`).join("")}</div>
    <div class="card soft"><div class="eyebrow">怎么用</div><h3>从站点导航回到论文</h3>
    <p>每篇详情页右栏固定三个出处入口：① 原文 DOI / 出版方官方页 ② arXiv 预印本 ③ 知网检索镜像。找不到原文时，用本页的出版方直达或知网检索兜底。</p></div>`;
});
</script>
</body>
</html>
