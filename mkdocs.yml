site_name: HZCU-学生宝典
site_description: HZCU-学生宝典
site_author: HZCU
site_url: https://hzcu-pc.github.io/hzcu-student-handbook/

copyright: HZCU-学生宝典

theme:
  name: material
  language: zh
  icon:
    logo: material/book-open-page-variant
  features:
    - header.autohide
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式
  font: false

markdown_extensions:
  - attr_list
  - md_in_html
  - footnotes

plugins:
  - search:
      lang:
        - zh
  - minify:
      minify_html: true
  - open-in-new-tab:

extra:
  generator: false

extra_css:
  - stylesheets/extra.css
  - stylesheets/light-home.css

nav:
  - 首页 · 前言: index.md
  - 前沿科技论文: papers.md
  - 优质 GitHub 仓库介绍: repositories.md
  - 地图 · 拍照: map.md
  - 食堂: dining.md
  - 校园风景: scenery.md
  - 学期安排: semester.md
  - 培养方案详解:
      - 学年总览: curriculum/index.md
      - 大一: curriculum/year-1.md
      - 大二: curriculum/year-2.md
      - 大三: curriculum/year-3.md
      - 大四: curriculum/year-4.md
  - 轻首页: start.md
